<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSBM LitMatrix AI</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Loaded directly in browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (To compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <script>
        // PDF.js worker setup
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Simple SVG Icons ---
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [isKeySaved, setIsKeySaved] = useState(false);
            const [summaries, setSummaries] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressText, setProgressText] = useState('');
            const fileInputRef = useRef(null);
            const importInputRef = useRef(null);

            // Extract Text Logic
            const extractTextFromFile = async (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const arrayBuffer = e.target.result;
                        try {
                            if (file.type === 'application/pdf') {
                                setProgressText('Reading PDF (this takes a moment)...');
                                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                                let fullText = '';
                                const maxPages = Math.min(pdf.numPages, 12); // First 12 pages usually covers intro to methodology
                                for (let i = 1; i <= maxPages; i++) {
                                    const page = await pdf.getPage(i);
                                    const textContent = await page.getTextContent();
                                    fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                                }
                                resolve(fullText);
                            } else if (file.name.endsWith('.docx')) {
                                setProgressText('Reading Word Document...');
                                const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                                resolve(result.value);
                            } else {
                                reject(new Error("Please upload a PDF or DOCX file."));
                            }
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            };

            // Gemini API Call
            const callGemini = async (promptText) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const schema = {
                    type: "OBJECT",
                    properties: {
                        relevantJournalArticle: { type: "STRING", description: "Title of the journal article" },
                        author: { type: "STRING", description: "Authors of the article" },
                        year: { type: "STRING", description: "Year of publication" },
                        publisherJournalName: { type: "STRING", description: "Name of the journal or publisher" },
                        journalRankIndexedJournal: { type: "STRING", description: "Rank or indexing status" },
                        linkForBaseArticle: { type: "STRING", description: "DOI or URL" },
                        problemBackgroundTheoretical: { type: "STRING", description: "Theoretical facts of the problem background" },
                        problemBackgroundPractical: { type: "STRING", description: "Practical facts of the problem background" },
                        mainObjective: { type: "STRING", description: "Main objective of the research" },
                        specificObjectives: { type: "STRING", description: "Specific objectives" },
                        mainResearchQuestion: { type: "STRING", description: "The primary research question" },
                        specificResearchQuestions: { type: "STRING", description: "Secondary research questions" },
                        hypothesis: { type: "STRING", description: "The hypotheses" },
                        population: { type: "STRING", description: "Target population" },
                        samplingMethod: { type: "STRING", description: "Sampling method" },
                        sampleSize: { type: "STRING", description: "Sample size" },
                        dataAnalysisMethod: { type: "STRING", description: "Method of data analysis" }
                    }
                };

                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json", responseSchema: schema },
                    systemInstruction: { parts: [{ text: "You are an expert research assistant. Extract data accurately. If not found, write 'Not specified'." }] }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API Key might be invalid or network error.");
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            };

            // Handle Uploading a Paper
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!isKeySaved) {
                    alert("Please enter your Gemini API Key first!");
                    return;
                }

                setIsProcessing(true);
                try {
                    const text = await extractTextFromFile(file);
                    const truncatedText = text.substring(0, 50000); // Prevent payload from being too large
                    
                    setProgressText('Analyzing with Gemini AI...');
                    const prompt = `Extract the methodology and literature details from this text:\n\n${truncatedText}`;
                    
                    const summaryData = await callGemini(prompt);
                    
                    setSummaries(prev => [{ id: Date.now(), ...summaryData }, ...prev]);
                    setProgressText('Done!');
                } catch (error) {
                    alert("Error: " + error.message);
                }
                
                setIsProcessing(false);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const deleteSummary = (id) => {
                setSummaries(summaries.filter(s => s.id !== id));
            };

            // EXPORT features
            const exportToCSV = () => {
                if (summaries.length === 0) return;
                const headers = ["Article", "Author", "Year", "Journal", "Rank", "Link", "Theoretical Facts", "Practical Facts", "Main Objective", "Specific Objectives", "Main RQ", "Specific RQs", "Hypothesis", "Population", "Sampling", "Sample Size", "Analysis Method"];
                const csvRows = [headers.join(",")];

                summaries.forEach(row => {
                    const values = [
                        `"${(row.relevantJournalArticle || '').replace(/"/g, '""')}"`, `"${(row.author || '').replace(/"/g, '""')}"`, `"${(row.year || '').replace(/"/g, '""')}"`, `"${(row.publisherJournalName || '').replace(/"/g, '""')}"`, `"${(row.journalRankIndexedJournal || '').replace(/"/g, '""')}"`, `"${(row.linkForBaseArticle || '').replace(/"/g, '""')}"`, `"${(row.problemBackgroundTheoretical || '').replace(/"/g, '""')}"`, `"${(row.problemBackgroundPractical || '').replace(/"/g, '""')}"`, `"${(row.mainObjective || '').replace(/"/g, '""')}"`, `"${(row.specificObjectives || '').replace(/"/g, '""')}"`, `"${(row.mainResearchQuestion || '').replace(/"/g, '""')}"`, `"${(row.specificResearchQuestions || '').replace(/"/g, '""')}"`, `"${(row.hypothesis || '').replace(/"/g, '""')}"`, `"${(row.population || '').replace(/"/g, '""')}"`, `"${(row.samplingMethod || '').replace(/"/g, '""')}"`, `"${(row.sampleSize || '').replace(/"/g, '""')}"`, `"${(row.dataAnalysisMethod || '').replace(/"/g, '""')}"`
                    ];
                    csvRows.push(values.join(","));
                });

                const link = document.createElement("a");
                link.href = "data:text/csv;charset=utf-8," + encodeURI(csvRows.join("\n"));
                link.download = "NSBM_Lit_Matrix.csv";
                link.click();
            };

            // "Save Work" (Exports as JSON so you can import it tomorrow)
            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(summaries));
                const link = document.createElement("a");
                link.href = dataStr;
                link.download = "LitMatrix_Backup.json";
                link.click();
            };

            // "Upload Work" (Imports the JSON file to resume)
            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        setSummaries(importedData);
                    } catch (err) {
                        alert("Invalid backup file.");
                    }
                };
                reader.readAsText(file);
                if (importInputRef.current) importInputRef.current.value = '';
            };

            return (
                <div>
                    <header className="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 className="text-xl font-bold">NSBM LitMatrix AI</h1>
                        <div className="flex gap-2">
                            <button onClick={exportBackup} className="bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded text-sm flex items-center gap-1"><IconSave/> Save Progress</button>
                            <label className="bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded text-sm cursor-pointer flex items-center gap-1">
                                <IconUpload/> Resume Work
                                <input type="file" accept=".json" onChange={importBackup} ref={importInputRef} className="hidden" />
                            </label>
                            <button onClick={exportToCSV} className="bg-white text-emerald-800 font-medium hover:bg-slate-100 px-3 py-1 rounded text-sm flex items-center gap-1"><IconDownload/> Export to Excel</button>
                        </div>
                    </header>

                    <main className="p-6 max-w-7xl mx-auto">
                        {/* API Key Setup */}
                        {!isKeySaved && (
                            <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-6 shadow-sm">
                                <h2 className="font-bold text-yellow-800 mb-2">Step 1: Enter Gemini API Key</h2>
                                <p className="text-sm text-yellow-700 mb-3">Get a free key from Google AI Studio. This connects your personal app to the AI.</p>
                                <div className="flex gap-2">
                                    <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="AIzaSy..." className="border rounded px-3 py-1 w-64" />
                                    <button onClick={() => setIsKeySaved(true)} className="bg-yellow-600 text-white px-4 py-1 rounded hover:bg-yellow-700">Save Key for Session</button>
                                </div>
                            </div>
                        )}

                        {/* Upload Area */}
                        <div className="bg-white border-2 border-dashed border-emerald-300 rounded-xl p-8 mb-8 text-center relative hover:bg-emerald-50 transition-colors shadow-sm">
                            <input type="file" ref={fileInputRef} accept=".pdf,.docx" onChange={handleFileUpload} disabled={isProcessing || !isKeySaved} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer disabled:cursor-not-allowed" />
                            <div className="flex flex-col items-center justify-center text-slate-500">
                                {isProcessing ? (
                                    <div className="font-medium text-emerald-600 animate-pulse">{progressText}</div>
                                ) : (
                                    <>
                                        <div className="text-emerald-500 mb-2"><IconUpload/></div>
                                        <p className="font-bold text-slate-700">Step 2: Upload Journal Article (.PDF or .DOCX)</p>
                                        <p className="text-sm">The AI will read it and add it to your matrix below.</p>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Matrix Table */}
                        <div className="bg-white rounded-lg shadow border border-slate-200 overflow-x-auto">
                            <table className="w-full text-sm text-left whitespace-nowrap">
                                <thead className="bg-slate-100 text-slate-600 uppercase border-b">
                                    <tr>
                                        <th className="px-4 py-3 sticky left-0 bg-slate-100">Actions</th>
                                        <th className="px-4 py-3 sticky left-16 bg-slate-100 shadow-[inset_-1px_0_0_#e2e8f0]">Article Title</th>
                                        <th className="px-4 py-3">Author & Year</th>
                                        <th className="px-4 py-3">Objectives</th>
                                        <th className="px-4 py-3">Methodology (Sample, Analysis)</th>
                                        <th className="px-4 py-3">Theoretical Facts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {summaries.length === 0 && (
                                        <tr><td colSpan="6" className="text-center py-8 text-slate-400">No articles summarized yet.</td></tr>
                                    )}
                                    {summaries.map(row => (
                                        <tr key={row.id} className="border-b hover:bg-slate-50 align-top">
                                            <td className="px-4 py-3 sticky left-0 bg-white">
                                                <button onClick={() => deleteSummary(row.id)} className="text-red-500 hover:bg-red-50 p-1 rounded"><IconTrash/></button>
                                            </td>
                                            <td className="px-4 py-3 sticky left-16 bg-white shadow-[inset_-1px_0_0_#e2e8f0] font-medium whitespace-normal min-w-[200px]">{row.relevantJournalArticle}</td>
                                            <td className="px-4 py-3 whitespace-normal min-w-[150px]">
                                                {row.author}<br/><span className="text-emerald-600 font-bold">{row.year}</span>
                                            </td>
                                            <td className="px-4 py-3 whitespace-normal min-w-[250px]">
                                                <strong>Main:</strong> {row.mainObjective}<br/>
                                                <strong>RQ:</strong> {row.mainResearchQuestion}
                                            </td>
                                            <td className="px-4 py-3 whitespace-normal min-w-[250px]">
                                                <strong>Sample:</strong> {row.sampleSize} ({row.population})<br/>
                                                <strong>Analysis:</strong> {row.dataAnalysisMethod}
                                            </td>
                                            <td className="px-4 py-3 whitespace-normal min-w-[300px] text-slate-600">
                                                {row.problemBackgroundTheoretical}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
