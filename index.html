<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitMatrix AI</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <script>
        // PDF.js worker setup
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <div id="root" class="flex flex-col flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG Icons ---
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconVideo = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;

        function App() {
            // Internal keys kept as 'nsbm_lit_key' so previous data isn't lost for the user
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('nsbm_lit_key') || '');
            const [isKeySaved, setIsKeySaved] = useState(() => !!localStorage.getItem('nsbm_lit_key'));
            const [showApiInfo, setShowApiInfo] = useState(false);
            const [summaries, setSummaries] = useState(() => {
                const saved = localStorage.getItem('nsbm_lit_data');
                return saved ? JSON.parse(saved) : [];
            });
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressText, setProgressText] = useState('');
            const fileInputRef = useRef(null);
            const importInputRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('nsbm_lit_data', JSON.stringify(summaries));
            }, [summaries]);

            const handleSaveKey = () => {
                if (apiKey.trim()) {
                    localStorage.setItem('nsbm_lit_key', apiKey.trim());
                    setIsKeySaved(true);
                }
            };

            const handleClearKey = () => {
                localStorage.removeItem('nsbm_lit_key');
                setApiKey('');
                setIsKeySaved(false);
            };

            const extractTextFromFile = async (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const arrayBuffer = e.target.result;
                        try {
                            if (file.type === 'application/pdf') {
                                setProgressText('Reading PDF...');
                                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                                let fullText = '';
                                const maxPages = Math.min(pdf.numPages, 12); 
                                for (let i = 1; i <= maxPages; i++) {
                                    const page = await pdf.getPage(i);
                                    const textContent = await page.getTextContent();
                                    fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                                }
                                resolve(fullText);
                            } else if (file.name.endsWith('.docx')) {
                                setProgressText('Reading Word Document...');
                                const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                                resolve(result.value);
                            } else {
                                reject(new Error("Please upload a PDF or DOCX file."));
                            }
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            };

            const callGemini = async (promptText) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const schema = {
                    type: "OBJECT",
                    properties: {
                        relevantJournalArticle: { type: "STRING", description: "Title of the journal article" },
                        author: { type: "STRING", description: "Authors of the article" },
                        year: { type: "STRING", description: "Year of publication" },
                        publisherJournalName: { type: "STRING", description: "Name of the journal or publisher" },
                        journalRankIndexedJournal: { type: "STRING", description: "Rank or indexing status. Put 'Not specified' if absent." },
                        linkForBaseArticle: { type: "STRING", description: "DOI or URL of the article" },
                        theoreticalFacts: { type: "STRING", description: "Theoretical facts of the problem background with citations" },
                        practicalFacts: { type: "STRING", description: "Practical facts of the problem background with citations" },
                        mainObjective: { type: "STRING", description: "Main objective of the research" },
                        specificObjectives: { type: "STRING", description: "Specific objectives of the research" },
                        mainResearchQuestion: { type: "STRING", description: "The primary research question" },
                        specificResearchQuestions: { type: "STRING", description: "Secondary or specific research questions" },
                        hypothesis: { type: "STRING", description: "The hypotheses proposed in the study" },
                        population: { type: "STRING", description: "Target population" },
                        samplingMethod: { type: "STRING", description: "Method used for sampling" },
                        sampleSize: { type: "STRING", description: "The exact sample size" },
                        dataAnalysisMethod: { type: "STRING", description: "Method of data analysis" }
                    }
                };

                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json", responseSchema: schema },
                    systemInstruction: { parts: [{ text: "You are an expert academic research assistant. Extract data accurately from the provided research paper text into the specified structure. If a field is not explicitly mentioned, summarize the closest relevant information or output 'Not explicitly stated'." }] }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API Key might be invalid, or API quota exceeded.");
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!isKeySaved) {
                    alert("Please enter your Gemini API Key first!");
                    return;
                }

                setIsProcessing(true);
                try {
                    const text = await extractTextFromFile(file);
                    const truncatedText = text.substring(0, 60000); 
                    
                    setProgressText('Analyzing with AI...');
                    const prompt = `Please analyze the following text extracted from a research paper. Extract the exact information required to fill out my literature review matrix columns.\n\nPaper Text:\n${truncatedText}`;
                    
                    const summaryData = await callGemini(prompt);
                    
                    setSummaries(prev => [...prev, { id: Date.now(), ...summaryData }]);
                    setProgressText('Done!');
                } catch (error) {
                    alert("Error: " + error.message);
                }
                
                setIsProcessing(false);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const deleteSummary = (id) => {
                if(confirm("Are you sure you want to delete this row?")) {
                    setSummaries(summaries.filter(s => s.id !== id));
                }
            };

            const exportToCSV = () => {
                if (summaries.length === 0) return;
                const headers = [
                    "No", "Relevant Journal Article", "Author", "Year", "Publisher / Journal Name", 
                    "Journal Rank/ Indexed Journal", "Link for the Base Article", 
                    "Problem Background: Theoretical Facts", "Problem Background: Practical Facts", 
                    "Research Objectives: Main Objective", "Research Objectives: Specific Objectives", 
                    "Research Questions: Main Research Question", "Research Questions: Specific Research Questions", 
                    "Hypothesis", "Proposed Methods: Population", "Proposed Methods: Sampling Method", 
                    "Proposed Methods: Sample Size", "Proposed Methods: Data Analysis Method"
                ];
                
                const csvRows = [headers.join(",")];

                summaries.forEach((row, index) => {
                    const values = [
                        index + 1,
                        `"${(row.relevantJournalArticle || '').replace(/"/g, '""')}"`, 
                        `"${(row.author || '').replace(/"/g, '""')}"`, 
                        `"${(row.year || '').replace(/"/g, '""')}"`, 
                        `"${(row.publisherJournalName || '').replace(/"/g, '""')}"`, 
                        `"${(row.journalRankIndexedJournal || '').replace(/"/g, '""')}"`, 
                        `"${(row.linkForBaseArticle || '').replace(/"/g, '""')}"`, 
                        `"${(row.theoreticalFacts || '').replace(/"/g, '""')}"`, 
                        `"${(row.practicalFacts || '').replace(/"/g, '""')}"`, 
                        `"${(row.mainObjective || '').replace(/"/g, '""')}"`, 
                        `"${(row.specificObjectives || '').replace(/"/g, '""')}"`, 
                        `"${(row.mainResearchQuestion || '').replace(/"/g, '""')}"`, 
                        `"${(row.specificResearchQuestions || '').replace(/"/g, '""')}"`, 
                        `"${(row.hypothesis || '').replace(/"/g, '""')}"`, 
                        `"${(row.population || '').replace(/"/g, '""')}"`, 
                        `"${(row.samplingMethod || '').replace(/"/g, '""')}"`, 
                        `"${(row.sampleSize || '').replace(/"/g, '""')}"`, 
                        `"${(row.dataAnalysisMethod || '').replace(/"/g, '""')}"`
                    ];
                    csvRows.push(values.join(","));
                });

                const link = document.createElement("a");
                link.href = "data:text/csv;charset=utf-8," + encodeURI(csvRows.join("\n"));
                link.download = "LitMatrix_Export.csv";
                link.click();
            };

            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(summaries));
                const link = document.createElement("a");
                link.href = dataStr;
                link.download = "LitMatrix_Backup.json";
                link.click();
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        setSummaries(importedData);
                    } catch (err) {
                        alert("Invalid backup file.");
                    }
                };
                reader.readAsText(file);
                if (importInputRef.current) importInputRef.current.value = '';
            };

            return (
                <div className="flex-grow flex flex-col">
                    {/* Header - Improved mobile wrapping */}
                    <header className="bg-indigo-900 text-white p-4 shadow-md flex flex-col sm:flex-row justify-between items-center sticky top-0 z-50 gap-4 sm:gap-0">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 p-2 rounded-lg">
                                <IconSave />
                            </div>
                            <h1 className="text-xl font-bold tracking-tight">LitMatrix AI</h1>
                        </div>
                        <div className="flex flex-wrap justify-center gap-2 w-full sm:w-auto">
                            <button onClick={exportBackup} className="bg-indigo-800 hover:bg-indigo-700 border border-indigo-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition-colors">
                                <IconSave/> <span className="hidden md:inline">Backup Data</span>
                            </button>
                            <label className="bg-indigo-800 hover:bg-indigo-700 border border-indigo-700 px-3 py-1.5 rounded-lg text-sm cursor-pointer flex items-center gap-2 transition-colors">
                                <IconUpload/> <span className="hidden md:inline">Restore Data</span>
                                <input type="file" accept=".json" onChange={importBackup} ref={importInputRef} className="hidden" />
                            </label>
                            <button onClick={exportToCSV} className="bg-white text-indigo-900 font-semibold hover:bg-slate-100 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition-colors">
                                <IconDownload/> Export CSV
                            </button>
                        </div>
                    </header>

                    <main className="p-4 md:p-6 flex-grow flex flex-col mx-auto w-full max-w-[1600px]">
                        
                        {/* API Key Setup */}
                        <div className="w-full max-w-3xl mx-auto mb-6">
                            {!isKeySaved ? (
                                <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
                                    <div className="flex items-center gap-2 mb-2">
                                        <h2 className="text-lg font-bold text-slate-800">1. Setup AI Connection</h2>
                                        <button 
                                            onClick={() => setShowApiInfo(!showApiInfo)} 
                                            className="text-indigo-500 hover:text-indigo-700 transition-colors p-1 bg-indigo-50 rounded-full"
                                            title="How to get a key?"
                                        >
                                            <IconInfo/>
                                        </button>
                                    </div>
                                    <p className="text-sm text-slate-500 mb-4">Your key is stored securely on your local device only.</p>
                                    
                                    {/* Instructional Dropdown */}
                                    {showApiInfo && (
                                        <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-4 text-sm text-indigo-900 animate-fade-in">
                                            <p className="font-semibold mb-2 text-indigo-800 text-base">Detailed steps to get your free Gemini API Key:</p>
                                            <ol className="list-decimal ml-5 space-y-2 mb-4 text-slate-700">
                                                <li>Go to <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="underline font-bold text-indigo-700 hover:text-indigo-500">Google AI Studio</a>.</li>
                                                <li>Sign in using your standard Google Account.</li>
                                                <li>Click the blue button that says <strong>"Create API key"</strong>.</li>
                                                <li>In the popup window, click <strong>"Create API key in a new project"</strong>.</li>
                                                <li>Wait a few seconds for Google to generate your unique key.</li>
                                                <li>Click <strong>"Copy"</strong>. The key will look like a long string of random letters starting with <code>AIzaSy...</code></li>
                                                <li>Come back here, paste the key into the box below, and click Save!</li>
                                            </ol>
                                            <a href="https://www.youtube.com/results?search_query=how+to+get+google+gemini+api+key" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 bg-white border border-indigo-200 px-3 py-1.5 rounded-lg text-indigo-600 hover:bg-indigo-100 transition-colors font-medium shadow-sm">
                                                <IconVideo/> Watch a video tutorial
                                            </a>
                                        </div>
                                    )}

                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <input 
                                            type="password" 
                                            value={apiKey} 
                                            onChange={(e) => setApiKey(e.target.value)} 
                                            placeholder="Paste your AIzaSy... key here" 
                                            className="border border-slate-300 rounded-xl px-4 py-2.5 w-full flex-grow focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50" 
                                        />
                                        <button onClick={handleSaveKey} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl hover:bg-indigo-700 font-medium transition-colors whitespace-nowrap">
                                            Save Key
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex justify-end items-center mb-2">
                                    <div className="flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100 mr-3 font-medium">
                                        <IconCheck/> API Key Connected
                                    </div>
                                    <button onClick={handleClearKey} className="text-xs text-slate-400 hover:text-red-500 hover:underline transition-colors">Change Key</button>
                                </div>
                            )}
                        </div>

                        {/* Upload Area */}
                        <div className={`bg-white border-2 border-dashed ${isProcessing ? 'border-indigo-400 bg-indigo-50' : 'border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/50'} rounded-2xl p-6 md:p-10 mb-8 text-center relative transition-all shadow-sm w-full max-w-3xl mx-auto`}>
                            <input type="file" ref={fileInputRef} accept=".pdf,.docx" onChange={handleFileUpload} disabled={isProcessing || !isKeySaved} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer disabled:cursor-not-allowed z-10" />
                            <div className="flex flex-col items-center justify-center text-slate-500">
                                {isProcessing ? (
                                    <div className="flex flex-col items-center">
                                        <div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
                                        <div className="font-semibold text-indigo-700">{progressText}</div>
                                    </div>
                                ) : (
                                    <>
                                        <div className={`mb-3 ${isKeySaved ? 'text-indigo-500' : 'text-slate-300'}`}><IconUpload/></div>
                                        <h2 className="text-lg font-bold text-slate-800 mb-1">2. Upload Journal Article</h2>
                                        <p className="text-sm">Supports .PDF or .DOCX format.</p>
                                        {!isKeySaved && <p className="text-xs text-red-400 mt-2 bg-red-50 px-2 py-1 rounded">Requires API Key to upload</p>}
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Full Matrix Table */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex-grow h-[60vh] relative overflow-hidden flex flex-col">
                            <div className="overflow-x-auto overflow-y-auto flex-grow" style={{ WebkitOverflowScrolling: 'touch' }}>
                                <table className="w-full text-sm text-left whitespace-nowrap border-collapse min-w-max">
                                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs font-semibold border-b border-slate-200 sticky top-0 z-20 shadow-sm">
                                        <tr>
                                            <th className="px-4 py-3 sticky left-0 bg-slate-100 z-30 border-r border-slate-200 text-center">No</th>
                                            {/* Note: Left sticky disabled on mobile for better UX, enabled on md+ screens */}
                                            <th className="px-4 py-3 sticky md:left-12 bg-slate-100 z-30 border-r border-slate-200 w-48">Article Title</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200">Author</th>
                                            <th className="px-4 py-3 border-r border-slate-200">Year</th>
                                            <th className="px-4 py-3 border-r border-slate-200">Publisher / Journal</th>
                                            <th className="px-4 py-3 border-r border-slate-200">Rank/ Indexed</th>
                                            <th className="px-4 py-3 border-r border-slate-200">Link</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200 bg-blue-50/60 text-blue-800">Theoretical Facts</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-blue-50/60 text-blue-800">Practical Facts</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200 bg-purple-50/60 text-purple-800">Main Objective</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-purple-50/60 text-purple-800">Specific Objectives</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200 bg-amber-50/60 text-amber-800">Main RQ</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-amber-50/60 text-amber-800">Specific RQs</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200">Hypothesis</th>
                                            
                                            <th className="px-4 py-3 border-r border-slate-200 bg-emerald-50/60 text-emerald-800">Population</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-emerald-50/60 text-emerald-800">Sampling Method</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-emerald-50/60 text-emerald-800">Sample Size</th>
                                            <th className="px-4 py-3 border-r border-slate-200 bg-emerald-50/60 text-emerald-800">Analysis Method</th>
                                            
                                            <th className="px-4 py-3 text-center sticky right-0 bg-slate-100 z-30 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)]">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {summaries.length === 0 && (
                                            <tr><td colSpan="19" className="text-center py-16 text-slate-400">No articles summarized yet. Upload a document to begin filling your matrix.</td></tr>
                                        )}
                                        {summaries.map((row, idx) => (
                                            <tr key={row.id} className="border-b border-slate-100 hover:bg-slate-50/80 align-top transition-colors">
                                                <td className="px-4 py-4 sticky left-0 bg-white border-r border-slate-100 z-10 text-center font-medium text-slate-500">{idx + 1}</td>
                                                <td className="px-4 py-4 sticky md:left-12 bg-white border-r border-slate-100 z-10 whitespace-normal min-w-[200px] font-semibold text-slate-800 md:shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                                                    {row.relevantJournalArticle}
                                                </td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[150px]">{row.author}</td>
                                                <td className="px-4 py-4 border-r border-slate-100">{row.year}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[150px] text-slate-600">{row.publisherJournalName}</td>
                                                <td className="px-4 py-4 border-r border-slate-100">{row.journalRankIndexedJournal}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 max-w-[150px] truncate text-indigo-600 hover:underline">
                                                    {row.linkForBaseArticle?.startsWith('http') ? <a href={row.linkForBaseArticle} target="_blank" rel="noreferrer">View Link</a> : row.linkForBaseArticle}
                                                </td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[300px] text-slate-600 bg-blue-50/20 leading-relaxed">{row.theoreticalFacts}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[300px] text-slate-600 bg-blue-50/20 leading-relaxed">{row.practicalFacts}</td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[250px] bg-purple-50/20">{row.mainObjective}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[250px] bg-purple-50/20 text-slate-600 leading-relaxed">{row.specificObjectives}</td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[250px] bg-amber-50/20">{row.mainResearchQuestion}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[250px] bg-amber-50/20 text-slate-600 leading-relaxed">{row.specificResearchQuestions}</td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[250px] text-slate-600 leading-relaxed">{row.hypothesis}</td>
                                                
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[180px] bg-emerald-50/20">{row.population}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[150px] bg-emerald-50/20">{row.samplingMethod}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[150px] bg-emerald-50/20 font-medium">{row.sampleSize}</td>
                                                <td className="px-4 py-4 border-r border-slate-100 whitespace-normal min-w-[200px] bg-emerald-50/20">{row.dataAnalysisMethod}</td>
                                                
                                                <td className="px-4 py-4 text-center sticky right-0 bg-white z-10 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                                                    <button onClick={() => deleteSummary(row.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="Delete Row">
                                                        <IconTrash/>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* Footer Section */}
                    <footer className="w-full bg-white border-t border-slate-200 py-6 mt-auto">
                        <div className="text-center text-slate-500 text-sm">
                            <p>&copy; {new Date().getFullYear()} Asitha. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</body>
